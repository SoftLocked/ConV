[workspace]
members = ["crates/document", "crates/simulator", "crates/protocol", "crates/native-peer", "crates/wasm", "crates/signaling"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
futures-util = "0.3"
